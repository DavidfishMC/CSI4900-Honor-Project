name: Notify fork

on:
  push:
    branches: [main]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger fork sync
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.FORK_DISPATCH_TOKEN }}" \
            https://api.github.com/repos/Sraucel/CSI4900-Honor-Project/dispatches \
            -d '{"event_type":"upstream-updated"}'
